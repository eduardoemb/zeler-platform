name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff
        run: uv run ruff check .

      - name: Direct Meli URL lint
        run: uv run python -m infra.lint.check_direct_meli .

      - name: Mypy
        # TODO: restore `uv run mypy .` after the current full-repo mypy baseline is clean.
        run: >-
          uv run mypy
          gateway/src/zeler_gateway/internal/router.py
          core/src/zeler_platform_core/models/operational.py
          infra/mongo/readiness.py
          infra/mongo/operations/ensure_zeler_app_admin_client.py
