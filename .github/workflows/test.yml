name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Pytest
        run: uv run pytest

      - name: Check Mongo schema export drift
        run: uv run python -m zeler_platform_core.cli.export_schemas infra/mongo/schemas --check
