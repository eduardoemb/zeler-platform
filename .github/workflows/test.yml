name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Start disposable integration services
        run: |
          set -euo pipefail
          docker run -d --name zeler-ci-mongo --ulimit nofile=65536:65536 \
            -p 127.0.0.1:27028:27017 mongo:7.0 \
            --replSet rs0 --bind_ip_all >/dev/null
          docker run -d --name zeler-ci-rabbit \
            -e RABBITMQ_DEFAULT_USER=ci -e RABBITMQ_DEFAULT_PASS=ci-local \
            -p 127.0.0.1:5673:5672 rabbitmq:3.13-alpine >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec zeler-ci-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -qx 1; then
              break
            fi
            sleep 2
          done
          docker exec zeler-ci-mongo mongosh --quiet \
            --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})' \
            >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec zeler-ci-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 2
          done
          test "$(docker exec zeler-ci-mongo mongosh --quiet \
            --eval 'db.hello().isWritablePrimary')" = true
          for attempt in $(seq 1 60); do
            if docker exec zeler-ci-rabbit rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec zeler-ci-rabbit rabbitmq-diagnostics -q ping >/dev/null

      - name: Pytest
        env:
          MONGO_URI: mongodb://127.0.0.1:27028/zeler_platform_ci?replicaSet=rs0&directConnection=true
          ZELER_SHEETS_TEST_BROKER_URL: amqp://ci:ci-local@127.0.0.1:5673/
        run: uv run pytest

      - name: Check Mongo schema export drift
        run: uv run python -m zeler_platform_core.cli.export_schemas infra/mongo/schemas --check
