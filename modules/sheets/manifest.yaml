name: sheets
version: 0.1.0
subscribed_events:
  - items.*
  - orders.*
  - shipments.*
  - questions.*
passive_consumers:
  - queue_name: zeler.sheets.claims
    routing_keys:
      - claims.updated
    externally_bound: true
owned_collections:
  - sheets_exports
  - sheets_sync_jobs
  - google_oauth_tokens
  - seller_unit_costs
allowed_meli_scopes:
  - GET /items
  - GET /items/*
  - GET /products/*
  - GET /sites/*/listing_prices
  - GET /users/*/shipping_options/free
  - GET /orders/*
  - GET /post-purchase/v1/claims/search
  - GET /post-purchase/v1/claims/*
  - GET /post-purchase/v2/claims/*/returns
  - GET /shipments/*
  - GET /questions/*
health_endpoint: /health
