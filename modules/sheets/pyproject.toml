[project]
name = "zeler-sheets"
version = "0.0.0"
description = "Sheets module package"
requires-python = ">=3.11"
dependencies = [
  "zeler_platform_core",
  "aio-pika>=9.4.0",
  "httpx>=0.27.0",
  "google-api-python-client>=2.120.0",
  "google-cloud-kms>=3.12.0",
  "pydantic-settings>=2.14.0",
  "cachetools>=5.3",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeler_sheets"]

[tool.uv.sources]
zeler_platform_core = { workspace = true }
