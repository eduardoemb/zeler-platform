steps:
  # Equivalent CLI: gcloud run jobs deploy zeler-bootstrap
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - bootstrap/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/zeler-platform/bootstrap:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/zeler-platform/bootstrap:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - zeler-bootstrap
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/zeler-platform/bootstrap:$SHORT_SHA
      - --region=us-central1
      - --tasks=1
      - --max-retries=3
      - --update-env-vars=ZELER_ENV=prod

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/zeler-platform/bootstrap:$SHORT_SHA
