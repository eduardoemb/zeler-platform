services:
  mongo:
    image: mongo:7.0
    container_name: zeler-mongo-dev
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - zeler-mongo-data:/data/db
    command: ["mongod", "--replSet", "rs0-dev", "--bind_ip_all", "--auth"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zeler-platform-dev

volumes:
  zeler-mongo-data:

networks:
  zeler-platform-dev:
