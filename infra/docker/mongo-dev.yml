name: zeler-mongo-dev

services:
  mongo:
    image: mongo:7.0
    container_name: zeler-mongo-dev
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - zeler-mongo-data:/data/db
      - ./mongo-keyfiles:/etc/mongo/keyfile:ro
    command:
      - mongod
      - --replSet
      - rs0-dev
      - --bind_ip_all
      - --auth
      - --keyFile
      - /etc/mongo/keyfile/rs0.key
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - zeler-platform-dev

volumes:
  zeler-mongo-data:

networks:
  zeler-platform-dev:
