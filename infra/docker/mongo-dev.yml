services:
  mongo:
    image: mongo:7.0
    container_name: zeler-mongo-dev
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - zeler-mongo-data:/data/db
    command: ["mongod", "--auth"]
    restart: unless-stopped
    networks:
      - zeler-platform-dev

volumes:
  zeler-mongo-data:

networks:
  zeler-platform-dev:
