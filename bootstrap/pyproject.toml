[project]
name = "zeler-bootstrap"
version = "0.0.0"
description = "Bootstrap jobs package for zeler-platform"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.0",
  "httpx>=0.28.1",
  "motor>=3.7.1",
  "zeler_platform_core",
  "zeler-sheets",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeler_bootstrap"]

[tool.uv.sources]
zeler_platform_core = { workspace = true }
zeler-sheets = { workspace = true }
