[project]
name = "zeler-gateway"
version = "0.0.0"
description = "Gateway service for zeler-platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "zeler_platform_core",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeler_gateway"]

[tool.uv.sources]
zeler_platform_core = { workspace = true }
