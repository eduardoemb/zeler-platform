[project]
name = "zeler-gateway"
version = "0.0.0"
description = "Gateway service for zeler-platform"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11.2",
  "cachetools>=7.0.6",
  "cryptography>=46.0.7",
  "fastapi>=0.110,<1",
  "google-cloud-kms>=3.12.0",
  "google-cloud-secret-manager>=2.27.0",
  "httpx>=0.28.1",
  "motor>=3.7.1",
  "pydantic-settings>=2.14.0",
  "pyjwt>=2.10.0",
  "zeler_platform_core",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeler_gateway"]

[tool.uv.sources]
zeler_platform_core = { workspace = true }
