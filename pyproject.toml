[project]
name = "zeler-platform"
version = "0.0.0"
description = "Zeler Platform — unified Mercado Libre integration platform"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "cachetools>=7.0.6",
  "commitizen>=3.29.0",
  "email-validator>=2.2.0",
  "fastapi>=0.110,<1",
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-sdk>=1.27.0",
  "pymongo>=4.8.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20240917",
  "respx>=0.23.1",
  "pytest-asyncio>=1.3.0",
  "types-cachetools>=6.2.0.20260408",
]

[tool.uv.workspace]
members = [
  "gateway",
  "core",
  "modules/*",
  "bootstrap",
]

[tool.uv.sources]
zeler_platform_core = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["gateway/src", "core/src", "modules/*/src", "bootstrap/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/gateway/src",
  "$MYPY_CONFIG_FILE_DIR/core/src",
  "$MYPY_CONFIG_FILE_DIR/modules/repricer/src",
  "$MYPY_CONFIG_FILE_DIR/modules/sheets/src",
  "$MYPY_CONFIG_FILE_DIR/modules/publicador/src",
  "$MYPY_CONFIG_FILE_DIR/modules/autoreply/src",
  "$MYPY_CONFIG_FILE_DIR/modules/sheets/tests",
  "$MYPY_CONFIG_FILE_DIR/bootstrap/src",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = [
  "gateway/tests",
  "core/tests",
  "modules/*/tests",
  "bootstrap/tests",
  "tests",
]
pythonpath = [
  ".",
  "gateway/src",
  "core/src",
  "modules/repricer/src",
  "modules/sheets/src",
  "modules/publicador/src",
  "modules/autoreply/src",
  "modules/sheets/tests",
  "bootstrap/src",
]
